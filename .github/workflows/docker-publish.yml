name: Build and publish Docker images

# Builds the backend and frontend images on every push to main and pushes them to the
# GitHub Container Registry (ghcr.io). Production (k3s) only pulls them - it holds no source
# code and builds nothing.
#
# Building the backend and the frontend is split into two independent jobs
# (build-backend, build-frontend). Thanks to the path filter (dorny/paths-filter) each
# runs only when files belonging to that service changed - a backend-only change no longer
# triggers a pointless rebuild and redeploy of the frontend image, and vice versa. A manual
# run via workflow_dispatch always builds both images. Both builds wait for their own tests
# and for the E2E job (see test-e2e).
#
# There is no deploy job: update-git writes the new image tag into charts/dietetyk/values.yaml
# and pushes it to main, and Argo CD syncs the cluster from there.
#
# Pull requests (05.10.2026) run every test job - backend, frontend, E2E - regardless of
# which paths changed, and nothing else: both build jobs and update-git carry
# `github.event_name != 'pull_request'`, so a PR never logs in to ghcr.io, never publishes
# an image and never touches values.yaml. Until then the workflow ran only on push to main,
# so no PR (Dependabot's included) was ever tested before merging, and the first run of a
# change was the one that deployed it. `pull_request`, not `pull_request_target`: the PR's
# code runs with the read-only token below and without secrets, including from a fork.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   GITHUB_TOKEN - built in; logs in to ghcr.io to push the images.
#   DEPLOY_PAT   - fine-grained PAT (Contents: Read & Write on this repository only) that
#                  update-git pushes the tag bump with, because main is protected - see the
#                  comment on that job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

# Least privilege (audit 04.10.2026, D-5). This used to grant `contents: write` and
# `packages: write` to EVERY job, and `npm ci` runs the install scripts of hundreds of
# packages in the test jobs: one compromised dependency could have pushed an image to
# ghcr.io under an existing sha- tag, or created branches and tags here. Now the default is
# read-only, `packages: write` exists only in the two build jobs (which install nothing on
# the runner - npm runs inside the Docker build), and update-git pushes with DEPLOY_PAT.
permissions:
  contents: read

jobs:
# Detects which parts of the repository changed, so the backend and frontend build jobs can
# run independently of each other and only when necessary.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Only on push: a PR runs all test jobs anyway (see the header), and the filter would
      # list the PR's files through the API, which needs `pull-requests: read` on the token.
      - name: Detect changed paths
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/backend.Dockerfile'
            frontend:
              - 'frontend/**'
              - 'docker/frontend.Dockerfile'

# Backend tests and security audit - a separate job, run BEFORE we start building and
# publishing the Docker image. The audit used to be one step inside the image-building job,
# so an audit failure and a build failure surfaced in the same place, making it hard to tell
# what had actually failed. Splitting it out also guarantees that an image is NEVER built
# and pushed from unverified dependencies (build-backend starts only when this job succeeds -
# see `needs`/`if` below).
  test-backend:
    name: Tests and security audit (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Vulnerability scan of the npm dependencies. It runs here in CI rather than locally in
      # a development environment or sandbox, because CI has real access to the npm registry.
      # --omit=dev - we audit production dependencies only (devDependencies such as nodemon
      # never reach the Docker image).
      #
      # The result goes through scripts/check-npm-audit.js, which can whitelist a named
      # package with a justification. The list is currently EMPTY: the exceptions it used to
      # hold (tar, @tootallnate/once, http-proxy-agent, make-fetch-happen, cacache, node-gyp,
      # sqlite3, brace-expansion, ip-address) all came from the sqlite3@5 -> node-gyp@8 chain
      # and disappeared with sqlite3@6. They were also not "build-time only" as claimed - tar
      # sits in the production image's /app/node_modules. sqlite3@6's prebuilt binary needs
      # glibc 2.38, which is why the backend image is on node:24-trixie-slim, not the default
      # (bookworm) node:24-slim - see docker/backend.Dockerfile. Any high/critical finding in a
      # production dependency blocks the pipeline; add an exception only with a reason here.
      - name: npm audit (backend)
        working-directory: ./backend
        run: |
          npm audit --omit=dev --json > /tmp/audit-backend.json || true
          node ../scripts/check-npm-audit.js /tmp/audit-backend.json ""

      # Unit tests need node_modules; `npm audit` above reads only the lockfile.
      #
      # --ignore-scripts, then a rebuild of sqlite3 alone: sqlite3 is the one dependency
      # whose install script matters (it fetches the prebuilt native binding), and running
      # every package's postinstall is exactly the supply-chain hook D-5 is about. Any other
      # package that ever needs its install script has to be named here on purpose.
      - name: Install dependencies (for tests)
        working-directory: ./backend
        run: |
          npm ci --ignore-scripts
          npm rebuild sqlite3

      # Test secrets are generated per run instead of being written into this file. A constant
      # here would be the same mistake as the constant that used to sit in backend/.env.example:
      # a value in the repository is a value an attacker has, and APP_PASSWORD is the material
      # ENCRYPTION_KEY is derived from (backend/utils/encryption.js). These values live only for
      # the length of the job, against a throwaway database.
      - name: Generate ephemeral test secrets
        run: |
          for name in APP_PASSWORD OAUTH_STATE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Unit tests (backend)
        working-directory: ./backend
        run: npm test

  build-backend:
    name: Build and push image (backend)
    needs: [changes, test-backend, test-e2e]
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.test-backend.result == 'success' &&
      needs.test-e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout kodu
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dietetyk-ai-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push are now separate steps: if the build itself (compiling the Dockerfile,
      # npm ci inside the image and so on) fails, nothing reaches the registry - the push step
      # never runs at all. A single step used to do both, which made it hard to tell a build
      # failure from a
      # logowania/publikacji do ghcr.io.
      - name: Build backend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push obrazu backendu do registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend

# The equivalent separate audit job for the frontend - see the comment on test-backend above
# (the same reasoning for splitting it from the build).
  test-frontend:
    name: Tests and security audit (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev

      # Until 04.10.2026 this job ran only the audit (D-9): the unit tests in
      # src/utils/*.test.js (dates in Europe/Warsaw, number formatting, charts), the i18n
      # drift check and lint existed, but nothing ran them. No install scripts are needed:
      # vite/esbuild work from their prebuilt optional packages.
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Unit tests, i18n check, lint (frontend)
        working-directory: ./frontend
        run: |
          npm test
          npm run check-i18n
          npm run lint

  build-frontend:
    name: Build and push image (frontend)
    needs: [changes, test-frontend, test-e2e]
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.test-frontend.result == 'success' &&
      needs.test-e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout kodu
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dietetyk-ai-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build frontend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push obrazu frontendu do registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend

# E2E gates publishing: both build jobs list test-e2e in `needs` and require it to succeed,
# so an image that failed E2E never reaches ghcr.io and never gets its tag written into
# values.yaml (sha-73e4afe went to production from a run with red E2E, because this job used
# to run alongside the builds and nothing waited for it). A failed or timed-out E2E skips
# the builds, which in turn skips update-git through its own `if` - the run ends red instead
# of waiting. timeout-minutes caps a hung browser or webServer (the default is 6 hours);
# a clean run takes a few minutes, retries included.
  test-e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout kodu
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The COMMITTED lockfiles, the same ones the Docker builds use - until 04.10.2026 the
      # images were built from a lockfile regenerated in CI (D-4), so E2E tested a different
      # dependency tree from the one shipped. Install scripts: see test-backend.
      - name: Install dependencies (backend)
        working-directory: ./backend
        run: |
          npm ci --ignore-scripts
          npm rebuild sqlite3

      - name: Install dependencies and build (frontend)
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install dependencies (root)
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Test secrets are generated per run instead of being written into this file. A constant
      # here would be the same mistake as the constant that used to sit in backend/.env.example:
      # a value in the repository is a value an attacker has, and APP_PASSWORD is the material
      # ENCRYPTION_KEY is derived from (backend/utils/encryption.js). These values live only for
      # the length of the job, against a throwaway database.
      - name: Generate ephemeral test secrets
        run: |
          for name in APP_PASSWORD OAUTH_STATE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # ADMIN_INITIAL_PASSWORD stays a literal: it is not key material, it is the fixture password
      # the Playwright specs type into the login form (e2e-tests/auth.spec.js), so both sides have
      # to agree on it. It only ever unlocks the throwaway database created inside this job.
      - name: Run E2E tests
        env:
          ADMIN_INITIAL_PASSWORD: 3bda877d518c8cf7a80b32bb
          CI: true
        run: npm run test:e2e

  update-git:
    name: Update Helm values in Git
    needs: [build-backend, build-frontend]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    # D-8 (audit 04.10.2026): two pushes A then B, A's build finishing last - A's update-git
    # reset to origin/main (already tagged sha-B), wrote sha-A and pushed, and Argo CD rolled
    # production back while the run showed green. Two guards: tag writes never run in
    # parallel (queued, not cancelled), and the step below refuses to write a tag older than
    # the one already there.
    #
    # Deliberately NOT a workflow-level `concurrency` with cancel-in-progress: the path filter
    # compares each push only with its own parent, so cancelling a backend-only run in favour
    # of a following frontend-only one would drop the backend build for good.
    concurrency:
      group: update-git-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Round 19 (audit): main is now protected by a rule requiring a PR (see the repository
      # ruleset "protect-main") - the default GITHUB_TOKEN pushes as github-actions[bot], which
      # is NOT on the bypass list (GitHub does not allow adding the generic "GitHub Actions"
      # integration as a bypass actor on a personal repository, only on an organisation one).
      # We therefore use a dedicated, narrowly scoped PAT (permissions: Contents: Read & Write
      # on this repository only) owned by the repository owner - a push with that token counts
      # as an admin push, so the rule lets it through.
      # fetch-depth 0: the ancestry checks below need the history, not just the tip.
      - name: Checkout kodu
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          fetch-depth: 0

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Retry with fetch+reset before each attempt (round 19 - fixed after a real push
      # collision): if main moved in the meantime - another run of this same workflow, e.g. a
      # push and a manual workflow_dispatch close together - a plain `git push` gets
      # "rejected (fetch first)" and the whole step fails, even though the change to values.yaml
      # is identical and harmless. Instead we reset to the freshest origin/main and repeat the
      # idempotent seds - if another run already made the same change, `git diff --cached
      # --quiet` detects that there is no real difference and we skip the commit.
      - name: Update image tags in values.yaml
        run: |
          if [ "${{ needs.build-backend.result }}" != "success" ] && [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "No images were built, skipping Helm tag update."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # This run's commit must still be on main (a force-push may have dropped it).
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "$GITHUB_SHA is no longer on main - not writing its tag."
              exit 0
            fi

            # Never replace a tag with an OLDER one: if the commit in the current tag already
            # contains this run's commit, a later run got here first and its tag stays.
            newer_tag_present() {
              current="$(sed -n -E "/^[[:space:]]*$1:/,/^[[:space:]]*tag: \"sha-/ { s|^[[:space:]]*tag: \"sha-([0-9a-f]+)\"$|\1|p; }" charts/dietetyk/values.yaml | head -1)"
              [ -n "$current" ] || return 1
              [ "$current" != "${{ steps.vars.outputs.sha_short }}" ] || return 1
              git merge-base --is-ancestor "$GITHUB_SHA" "$current" 2>/dev/null
            }

            if [ "${{ needs.build-backend.result }}" = "success" ] && newer_tag_present backend; then
              echo "backend: values.yaml already points at a newer commit - leaving it."
            elif [ "${{ needs.build-backend.result }}" = "success" ]; then
              # Zakres konczy sie na PRAWDZIWYM tagu, nie na pierwszej linii
              # zawierajacej "tag:" - komentarz z takim ciagiem przejmowalby
              # podmiane na siebie, zostawiajac prawdziwy tag nietkniety.
              sed -i -E "/^[[:space:]]*backend:/,/^[[:space:]]*tag: \"sha-/ { s|^([[:space:]]*)tag: \"sha-[^\"]*\"$|\1tag: \"sha-${{ steps.vars.outputs.sha_short }}\"| }" charts/dietetyk/values.yaml
              grep -q 'tag: "sha-${{ steps.vars.outputs.sha_short }}"' charts/dietetyk/values.yaml || { echo "::error::sed nie podmienil tagu backendu"; exit 1; }
            fi
            if [ "${{ needs.build-frontend.result }}" = "success" ] && newer_tag_present frontend; then
              echo "frontend: values.yaml already points at a newer commit - leaving it."
            elif [ "${{ needs.build-frontend.result }}" = "success" ]; then
              sed -i -E "/^[[:space:]]*frontend:/,/^[[:space:]]*tag: \"sha-/ { s|^([[:space:]]*)tag: \"sha-[^\"]*\"$|\1tag: \"sha-${{ steps.vars.outputs.sha_short }}\"| }" charts/dietetyk/values.yaml
              grep -q 'tag: "sha-${{ steps.vars.outputs.sha_short }}"' charts/dietetyk/values.yaml || { echo "::error::sed nie podmienil tagu frontendu"; exit 1; }
            fi
            git add charts/dietetyk/values.yaml

            if git diff --cached --quiet; then
              echo "Tagi już aktualne na origin/main (ustawione przez inny bieg) - pomijam commit."
              break
            fi

            git commit -m "chore: update image tags to sha-${{ steps.vars.outputs.sha_short }} [skip ci]"

            if git push; then
              echo "Wypchnięto pomyślnie (próba $attempt/5)."
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Nie udało się wypchnąć zmiany do main po 5 próbach."
              exit 1
            fi
            echo "Push odrzucony (próba $attempt/5) - main przesunęło się w międzyczasie, ponawiam..."
            sleep $(( (RANDOM % 5) + 1 ))
          done
