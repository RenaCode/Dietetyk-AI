name: Build and publish Docker images

# Builds the backend and frontend images on every push to main and pushes them to the
# GitHub Container Registry (ghcr.io). The production server only pulls them
# (docker-compose pull) - it no longer holds source code or builds locally.
#
# Building the backend and the frontend is split into two independent jobs
# (build-backend, build-frontend). Thanks to the path filter (dorny/paths-filter) each
# runs only when files belonging to that service changed - a backend-only change no longer
# triggers a pointless rebuild and redeploy of the frontend image, and vice versa. A manual
# run via workflow_dispatch always builds both images.
#
# After the images are built and pushed (CI), the deploy job (CD) connects over SSH to the
# production server and refreshes the containers (docker compose pull + up -d).
# Wymaga ustawienia w repo (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     - adres IP lub domena serwera (np. 185.201.112.104)
#   VPS_USER     - a dedicated, UNPRIVILEGED SSH user (e.g. "deploy") belonging to the
#                  "docker" group - deliberately NOT root. See the repository notes for
#                  instructions on creating that account on the server.
#   VPS_SSH_KEY  - the private SSH key (dedicated to CI/CD only), whose public counterpart
#                  must be added to ~/.ssh/authorized_keys
#                  konta "deploy" na serwerze)
#   VPS_SSH_PORT - (optional) SSH port, 22 by default

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: write
  packages: write

jobs:
# Detects which parts of the repository changed, so the backend and frontend build jobs can
# run independently of each other and only when necessary.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/backend.Dockerfile'
            frontend:
              - 'frontend/**'
              - 'docker/frontend.Dockerfile'

# Backend tests and security audit - a separate job, run BEFORE we start building and
# publishing the Docker image. The audit used to be one step inside the image-building job,
# so an audit failure and a build failure surfaced in the same place, making it hard to tell
# what had actually failed. Splitting it out also guarantees that an image is NEVER built
# and pushed from unverified dependencies (build-backend starts only when this job succeeds -
# see `needs`/`if` below).
  test-backend:
    name: Tests and security audit (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A separate step purely to generate package-lock.json (needed by `npm audit`) - we do
      # not install the full node_modules, because it is not needed here: the Docker image
      # installs dependencies itself, in its own builder.
      - name: Install dependencies (lockfile)
        working-directory: ./backend
        run: npm install --package-lock-only

      # Vulnerability scan of the npm dependencies. It runs here in CI rather than locally in
      # a development environment or sandbox, because CI has real access to the npm registry.
      # --omit=dev - we audit production dependencies only (devDependencies such as nodemon
      # never reach the Docker image).
      #
      # The result is filtered through scripts/check-npm-audit.js, because `npm audit` on its
      # own does not distinguish a vulnerability in runtime code from one in tooling used only
      # during `npm ci` to compile a native module (node-gyp, tar, http-proxy-agent,
      # @tootallnate/once). An attempt to "fix" this by bumping sqlite3 to a new major version
      # actually broke production: the prebuilt binary required a newer glibc than node:20-slim
      # provides (ERR_DLOPEN_FAILED). Those specific packages are therefore explicitly
      # whitelisted with a justification - any OTHER high or critical vulnerability, meaning a
      # real runtime dependency, still blocks the pipeline.
      #
      # "sqlite3" is on that list too (alongside the node-gyp/tar tooling itself): `npm audit`
      # propagates risk from the whole chain
      # from a transitive dependency up to the direct dependency in package.json when the only
      # suggested fix requires bumping that one. That is why sqlite3 itself comes out as
      # "high" - still the same already-documented build-time-only problem, not a new, real
      # runtime vulnerability.
      - name: npm audit (backend)
        working-directory: ./backend
        run: |
          npm audit --omit=dev --json > /tmp/audit-backend.json || true
          node ../scripts/check-npm-audit.js /tmp/audit-backend.json "tar,@tootallnate/once,http-proxy-agent,make-fetch-happen,cacache,node-gyp,sqlite3,brace-expansion,ip-address"

      # Testy jednostkowe backendu (tests/test-encryption.js, test-rate-limit.js,
      # test-chat.js, test-meals.js - see the "test" script in package.json). These files
      # existed in tests/ before, but nothing ever ran them in CI and there was no npm "test"
      # script - a bug in the chat, meal analysis, encryption or rate limiter logic would have
      # gone unnoticed all the way to production. A separate `npm ci` (a full install), because
      # the audit step above deliberately installs only the lockfile, without node_modules.
      - name: Install dependencies (full install for tests)
        working-directory: ./backend
        run: npm ci

      - name: Unit tests (backend)
        working-directory: ./backend
        env:
          APP_PASSWORD: dietetyk-ci-test-password
        run: npm test

      # Pass the freshly regenerated lockfile to the build-backend job (a separate runner means
      # a separate checkout, which cannot see files from this job). This way `npm ci` inside
      # Docker always receives a lockfile consistent with the current package.json, generated
      # here in CI where there is real access to the npm registry - nobody has to refresh it by
      # hand locally.
      - name: Pass the updated lockfile to build-backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-lockfile
          path: backend/package-lock.json
          retention-days: 1

  build-backend:
    name: Build and push image (backend)
    needs: [changes, test-backend]
    if: |
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.test-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v5

      - name: Fetch the updated lockfile from the test-backend job
        uses: actions/download-artifact@v4
        with:
          name: backend-lockfile
          path: backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dietetyk-ai-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push are now separate steps: if the build itself (compiling the Dockerfile,
      # npm ci inside the image and so on) fails, nothing reaches the registry - the push step
      # never runs at all. A single step used to do both, which made it hard to tell a build
      # failure from a
      # logowania/publikacji do ghcr.io.
      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push obrazu backendu do registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend

# The equivalent separate audit job for the frontend - see the comment on test-backend above
# (the same reasoning for splitting it from the build).
  test-frontend:
    name: Tests and security audit (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (lockfile)
        working-directory: ./frontend
        run: npm install --package-lock-only

      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Pass the updated lockfile to build-frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: frontend/package-lock.json
          retention-days: 1

  build-frontend:
    name: Build and push image (frontend)
    needs: [changes, test-frontend]
    if: |
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v5

      - name: Fetch the updated lockfile from the test-frontend job
        uses: actions/download-artifact@v4
        with:
          name: frontend-lockfile
          path: frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dietetyk-ai-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push obrazu frontendu do registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend

  test-e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (backend)
        working-directory: ./backend
        run: npm ci

      - name: Install dependencies and build (frontend)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies (root)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          ADMIN_INITIAL_PASSWORD: 3bda877d518c8cf7a80b32bb
          APP_PASSWORD: dietetyk-admin
          CI: true
        run: npm run test:e2e

  update-git:
    name: Update Helm values in Git
    needs: [build-backend, build-frontend]
    if: |
      always() &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      # Round 19 (audit): main is now protected by a rule requiring a PR (see the repository
      # ruleset "protect-main") - the default GITHUB_TOKEN pushes as github-actions[bot], which
      # is NOT on the bypass list (GitHub does not allow adding the generic "GitHub Actions"
      # integration as a bypass actor on a personal repository, only on an organisation one).
      # We therefore use a dedicated, narrowly scoped PAT (permissions: Contents: Read & Write
      # on this repository only) owned by the repository owner - a push with that token counts
      # as an admin push, so the rule lets it through.
      - name: Checkout kodu
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Retry with fetch+reset before each attempt (round 19 - fixed after a real push
      # collision): if main moved in the meantime - another run of this same workflow, e.g. a
      # push and a manual workflow_dispatch close together - a plain `git push` gets
      # "rejected (fetch first)" and the whole step fails, even though the change to values.yaml
      # is identical and harmless. Instead we reset to the freshest origin/main and repeat the
      # idempotent seds - if another run already made the same change, `git diff --cached
      # --quiet` detects that there is no real difference and we skip the commit.
      - name: Update image tags in values.yaml
        run: |
          if [ "${{ needs.build-backend.result }}" != "success" ] && [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "No images were built, skipping Helm tag update."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ "${{ needs.build-backend.result }}" = "success" ]; then
              sed -i '/backend:/,/tag:/ { s/tag: .*/tag: "sha-${{ steps.vars.outputs.sha_short }}"/ }' charts/dietetyk/values.yaml
            fi
            if [ "${{ needs.build-frontend.result }}" = "success" ]; then
              sed -i '/frontend:/,/tag:/ { s/tag: .*/tag: "sha-${{ steps.vars.outputs.sha_short }}"/ }' charts/dietetyk/values.yaml
            fi
            git add charts/dietetyk/values.yaml

            if git diff --cached --quiet; then
              echo "Tagi już aktualne na origin/main (ustawione przez inny bieg) - pomijam commit."
              break
            fi

            git commit -m "chore: update image tags to sha-${{ steps.vars.outputs.sha_short }} [skip ci]"

            if git push; then
              echo "Wypchnięto pomyślnie (próba $attempt/5)."
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Nie udało się wypchnąć zmiany do main po 5 próbach."
              exit 1
            fi
            echo "Push odrzucony (próba $attempt/5) - main przesunęło się w międzyczasie, ponawiam..."
            sleep $(( (RANDOM % 5) + 1 ))
          done
