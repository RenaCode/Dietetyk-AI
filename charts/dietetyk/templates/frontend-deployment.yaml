apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dietetyk.fullname" . }}-frontend
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "dietetyk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        # The config is mounted with subPath, which never sees ConfigMap updates, and nginx
        # reads it only at start. Without this a change to nginx-configmap.yaml (say, a log
        # redaction fix) syncs "green" in Argo CD while the old config keeps running.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "dietetyk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "dietetyk.imagePullSecrets" . | nindent 6 }}
      # Nothing in this pod talks to the Kubernetes API. The default ServiceAccount has no RBAC
      # today, but its token in /var/run/secrets/... is still a free foothold for
      # reconnaissance after an RCE, and the egress policy lets traffic reach the API server
      # (audit 04.10.2026, D-14).
      automountServiceAccountToken: false
      # Non-root since audit 2026-10-10 (S-K1): until then nginx ran as uid 0 with the default
      # capabilities and a writable root filesystem, on the only pod of this app that faces the
      # internet. The image is nginx-unprivileged (docker/frontend.Dockerfile, uid 101, port
      # 8080). runAsUser is set explicitly, not left to the image's USER, so that the pod also
      # starts as 101 on the previous nginx:alpine image: Argo CD applies this chart as soon as
      # it is merged, minutes before CI writes the new image tag. That is also why /var/cache/nginx
      # and /run are mounted below - the unprivileged image does not use them, the old one does.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          # Port 8080 (nginx-configmap.yaml): a non-root process cannot bind 80 under containerd.
          # No capability is needed for anything nginx does here, and nothing writes outside
          # the emptyDirs below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          # Until 04.10.2026 the frontend had no probes (D-14): the pod got traffic before nginx
          # was listening, and a hung nginx was never restarted. `/` is the SPA's index.html,
          # served by nginx alone - it does not touch the backend, so a backend restart
          # (Recreate, ~20 s) does not take the frontend out of the Service with it.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # pid file and the temp files nginx buffers request bodies into (Apple Health
            # webhooks up to client_max_body_size 20m).
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config-volume
          configMap:
            name: {{ include "dietetyk.fullname" . }}-nginx-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
