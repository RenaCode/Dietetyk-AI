{{- if and .Values.ingress.enabled .Values.sso.enabled }}
# SSO with enforced 2FA (Authelia, renacode-infra k3s/platforma/authelia.yaml) in front of the
# ADMIN API only. Everything else on this host stays public on purpose: end users log in with
# their own accounts, the iOS Shortcut posts to /api/integrations/apple-health/:syncToken,
# Oura/Withings/Google Fit call back to /api/integrations/*/callback, and shared reports are
# opened by token at /api/public/shared-reports/:token - none of them can pass a browser SSO.
#
# An IngressRoute, not an Ingress: Express matches routes case-insensitively, so
# `/api/ADMIN/users` reaches the admin router in the backend, while an Ingress `Prefix` path is
# case-sensitive and would hand that request to the public router - around Authelia. The
# `(?i)` regex catches every spelling. Traefik orders routers by rule length, so this rule
# beats the main Ingress (`PathPrefix(/)`). Paths like `//api/admin` and `/api/./admin` are
# normalised by Traefik before routing (checked on k3s v1.35.5 with the cluster's Traefik).
#
# The admin panel UI is part of the SPA and calls /api/admin/* with fetch(). A fetch cannot
# follow the redirect to auth.renacode.com, so log in to Authelia first (any protected page,
# e.g. https://dietetyk.renacode.com/api/admin/config in the address bar), then open the panel.
# The app's own requireAdmin + 2FA stay in place behind this.
#
# Off by default; turned on from the Argo CD valuesObject (renacode-infra argocd-apps.yaml)
# after the owner registered 2FA in Authelia. On with Authelia down = 500 on /api/admin only.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "dietetyk.fullname" . }}-admin
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathRegexp(`(?i)^/api/admin`)
      kind: Rule
      middlewares:
        - name: {{ .Values.sso.middleware.name }}
          namespace: {{ .Values.sso.middleware.namespace }}
      services:
        - name: {{ include "dietetyk.fullname" . }}-frontend
          port: 80
  # The certificate is issued for the main Ingress (cert-manager annotation there); this route
  # only uses the same secret.
  tls:
    secretName: {{ .Values.ingress.tlsSecret }}
{{- end }}
