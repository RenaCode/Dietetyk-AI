{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dietetyk.fullname" . }}
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
  {{- /* SSO (values `sso`): strip client-supplied identity headers, then Authelia forwardAuth.
  Machine paths that must stay reachable without a browser login: ingress-machine.yaml. */}}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if .Values.sso.enabled }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (join "," .Values.sso.middlewares) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dietetyk.fullname" $ }}-frontend
                port:
                  number: 80
{{- end }}
