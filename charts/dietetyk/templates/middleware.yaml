{{- if and .Values.ingress.enabled .Values.ingress.redirectToHttps }}
# HTTP -> HTTPS redirect (audit 04.10.2026, D-13). The app's router listens on `websecure`
# only, so port 80 had no rule for this host and Traefik answered its own bare 404: a first
# visit typed without https://, a link in a text message, or a Health Auto Export webhook URL
# pasted without the `s` all ended in an error page. HSTS only helps after a first successful
# HTTPS visit. Same pattern as charts/renacode-website in the renacode-website repo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "dietetyk.fullname" . }}-redirect-https
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# A separate Ingress on the `web` entrypoint whose only job is the redirect: the entrypoint
# is an annotation of the WHOLE Ingress, so one object cannot serve content on websecure and
# redirect on web. No `tls` section on purpose - it would make cert-manager issue a second
# certificate for the same host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dietetyk.fullname" . }}-http-redirect
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "dietetyk.fullname" . }}-redirect-https@kubernetescrd
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dietetyk.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
