{{- if .Values.networkPolicy.enabled }}
# Only the frontend's nginx may open connections to the backend.
#
# Without this, every pod in the cluster - any other application, anything compromised in
# it - could reach the backend on :3000 directly, skipping nginx (its body-size limit, its
# header handling) and, with the sqlite-web sidecar enabled, :8080 with no authentication at
# all. Port 8080 is deliberately not listed, so the sidecar stays reachable only through
# `kubectl port-forward`.
#
# Kubelet probes and `kubectl port-forward` keep working: k3s' NetworkPolicy controller
# (kube-router) accepts traffic whose source is the node itself (`-m addrtype --src-type
# LOCAL`) before it evaluates any policy - checked in the node's iptables on 2026-10-03.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dietetyk.fullname" . }}-backend
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dietetyk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dietetyk.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - port: 3000
          protocol: TCP
---
# Only Traefik may open connections to the frontend - it is the Ingress backend for
# dietetyk.renacode.com. Traefik proxies from its own pod address (the hostPort goes through
# svclb to the traefik Service first), so the source is the traefik pod in kube-system, not
# the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dietetyk.fullname" . }}-frontend
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dietetyk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefik.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefik.podLabels | nindent 14 }}
      ports:
        - port: 80
          protocol: TCP
{{- if .Values.networkPolicy.egress.enabled }}
---
# Egress for both pods: no route into the private networks listed in
# networkPolicy.egress.siecDomowa (set by the cluster operator), everything else unchanged - DNS, other
# pods, the internet (Gemini, Anthropic, Google OAuth, Oura, Mailgun). Rules and the reason
# 0.0.0.0/0 is split in two: `dietetyk.regulyEgress` in _helpers.tpl.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dietetyk.fullname" . }}-egress
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dietetyk.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- include "dietetyk.regulyEgress" . | nindent 4 }}
{{- end }}
{{- end }}
