apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dietetyk.fullname" . }}-nginx-config
data:
  default.conf: |
    # This file is included inside nginx's `http {}` block (conf.d/*.conf), so the map and
    # log_format directives below are legal at its top level.

    # Access log WITHOUT query strings and with token-bearing paths redacted.
    #
    # The image's default `main` format logs `$request` (path + query) and `$http_referer`.
    # Several URLs carry secrets: /register?token=inv_... (an invitation - possibly for an
    # admin account), /api/invitation-status?token=..., the OAuth callbacks' ?code=&state=,
    # /api/integrations/apple-health/<sync_token> and /api/public/shared-reports/<token> (the
    # only key to a PDF of somebody's health data). And the Referer of every asset request
    # made by the registration page repeated its URL - invitation token included. All of it
    # landed in the frontend pod's log, readable by anyone with `kubectl logs` or access to
    # wherever logs are shipped. The first map cuts the query string off the ORIGINAL request
    # path ($uri would show /index.html after try_files); the second blanks the two path tokens.
    map $request_uri $dietetyk_request_path {
        ~^(?<dietetyk_path>[^?]*)              $dietetyk_path;
    }
    map $dietetyk_request_path $dietetyk_log_uri {
        default                                $dietetyk_request_path;
        ~^/api/integrations/apple-health/      "/api/integrations/apple-health/[redacted]";
        ~^/api/public/shared-reports/          "/api/public/shared-reports/[redacted]";
    }
    log_format dietetyk_safe '$remote_addr - [$time_local] "$request_method $dietetyk_log_uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

    # TLS ends at Traefik, which tells us the original scheme in X-Forwarded-Proto. Passing
    # `$scheme` on (as this file used to) overwrote that with this hop's plain `http`, so the
    # backend believed every request was insecure: the Google sign-in nonce cookie was set
    # without `Secure`, and URLs built without APP_URL started with http://. Fall back to
    # $scheme only when no proxy in front set the header (local docker runs).
    map $http_x_forwarded_proto $dietetyk_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        access_log /var/log/nginx/access.log dietetyk_safe;
        # The redaction above covers the ACCESS log only. nginx's error log prints the raw
        # request line, and the Apple Health sync_token is part of that line: every webhook
        # body larger than the in-memory buffer produced a `[warn] a client request body is
        # buffered to a temporary file ... request: "POST /api/integrations/apple-health/<token>"`
        # in the frontend pod's log - the token being the webhook's only credential. At level
        # `error` that warning (and every other warn/notice) is dropped; real errors still
        # show up. client_body_buffer_size in `location /api` is the second half of the fix.
        error_log /dev/stderr error;

        # Large enough for the Apple Health webhook (workouts with GPS route data). The
        # backend applies its own, much smaller limit everywhere else (see backend/app.js).
        client_max_body_size 20m;

        # Security headers. `always` so they are also sent on error responses.
        #
        # HSTS: the site is only ever served over HTTPS (Traefik websecure entrypoint). No
        # `preload` - that is a commitment for the whole domain that cannot be taken back
        # quickly, and it is not this chart's to make.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # no-referrer rather than strict-origin-when-cross-origin: the registration page's
        # URL carries the invitation token, and the app has no use for outgoing Referers.
        add_header Referrer-Policy "no-referrer" always;
        # Content-Security-Policy matched to what the frontend actually loads
        # (frontend/index.html, App.jsx, the components):
        #   - script-src 'self': the Vite build emits external, hashed module scripts and no
        #     inline <script>.
        #   - style-src 'unsafe-inline': the components use inline style props throughout; plus
        #     fonts.googleapis.com for the Google Fonts stylesheet in index.html.
        #   - font-src fonts.gstatic.com: where Google Fonts serves the font files.
        #   - img-src data: blob: - the avatar, the 2FA QR code and meal photo previews are
        #     base64 data URIs; downloads are built from blob: URLs.
        #   - connect-src 'self': every fetch() goes to /api on this origin.
        #   - form-action 'self': OAuth flows are started by window.location, not by forms.
        #   - frame-ancestors 'none': nothing embeds the app (same intent as X-Frame-Options).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api {
            # Webhook payloads up to 1 MB stay in memory instead of a temp file on disk (the
            # default 16k spilled almost every Apple Health sync). This saves I/O; it is not
            # what keeps the token out of the log - error_log above does that, also for the
            # larger bodies that still go to a temp file.
            client_body_buffer_size 1m;
            proxy_pass http://{{ include "dietetyk.fullname" . }}-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $dietetyk_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            # Longer than the worst case of one AI call (2 models x 90 s, GEMINI_WORST_CASE_MS in
            # backend/config.js) plus the request around it. The default 60 s answered a slow
            # meal photo analysis with 504 while the backend still saved the meal - and the
            # user, told it had failed, sent it again (audit 2026-10-09, W2).
            proxy_read_timeout 210s;
            proxy_send_timeout 210s;
        }
    }
