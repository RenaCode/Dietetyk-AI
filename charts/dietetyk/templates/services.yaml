apiVersion: v1
kind: Service
metadata:
  name: {{ include "dietetyk.fullname" . }}-backend
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "dietetyk.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dietetyk.fullname" . }}-frontend
  labels:
    {{- include "dietetyk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  ports:
    # The Service stays on 80 (the Ingress points at it); the pod listens on 8080 since it
    # runs as non-root (frontend-deployment.yaml).
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "dietetyk.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
