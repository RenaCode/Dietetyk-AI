replicaCount: 1

# Ile starych ReplicaSetow trzymac po rolloucie. Domyslne k8s to 10, co przy
# deployu z kazdego pusha uzbieralo 115 pustych RS w ~2.5 miesiaca.
revisionHistoryLimit: 3

# Credentials for pulling private backend/frontend images from GHCR.
# Leave empty [] if packages are public at https://github.com/orgs/renacode/packages
# or if node-level credentials are used.
# If images are private, create the secret once per namespace:
#   kubectl create secret docker-registry ghcr-pull --docker-server=ghcr.io --docker-username=<user> --docker-password=<pat>
imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/renacode/dietetyk-ai-backend
    tag: "sha-d8a8a2c"
    pullPolicy: IfNotPresent
  secretName: dietetyk-backend-secret
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

frontend:
  image:
    repository: ghcr.io/renacode/dietetyk-ai-frontend
    tag: "sha-aa2661f"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # How nginx finds the backend (upstream `dietetyk_backend` in templates/nginx-configmap.yaml):
  # the name is resolved in the background through this resolver, so nginx starts even when
  # cluster DNS is not answering yet. `resolver` must be an IP address - nginx would resolve a hostname
  # there at start, the very dependency this removes. 10.43.0.10 is kube-dns' ClusterIP in
  # k3s' default service CIDR (10.43.0.0/16); another cluster: `kubectl -n kube-system get
  # svc kube-dns`. `resolverValid` is how often the name is re-resolved (the ClusterIP changes
  # only when the Service is recreated).
  nginx:
    resolver: 10.43.0.10
    resolverValid: 30s
    clusterDomain: cluster.local

# Catering sync CronJob (templates/catering-cronjob.yaml, backend/catering/sync.js): imports
# today's menu from the catering's Dietly customer panel as meals, with the provider's own
# nutrition values instead of Gemini estimates. Needs the Secret described at the top of the
# template; ON since 2026-10-13, after a dry run against the live account (5 meals, 2473 kcal).
catering:
  enabled: true
  secretName: dietetyk-catering
  # The catering's slug in Dietly (the `company` parameter of its login link).
  dietlyCompany: betterlifecateringdietetyczny
  # Must be one of CATERING_SOURCES in backend/routes/catering.js.
  source: betterlife
  # Europe/Warsaw (set in the template). 06:30 puts the day in before breakfast; the later
  # runs pick up dishes swapped in the panel during the day - each run replaces the day.
  schedule: "30 6,12,18 * * *"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 64Mi

# sqlite-web sidecar in the backend pod. OFF by default: sqlite-web has no authentication,
# the image listens on 0.0.0.0:8080, and it mounts the database read-write - so with it on,
# ANY pod in the cluster can reach the pod IP and read or edit every table, including the
# `sessions` table (live session tokens = log in as any user, admins included), unless
# `networkPolicy.enabled` is on - the backend policy admits :3000 only. The README's "only
# reachable locally" promise held for the docker-compose setup (bound to 127.0.0.1 on the
# VPS), not for k8s.
# Enable it only for a debugging session and turn it off again:
#   helm upgrade ... --set dbImage.enabled=true
#   kubectl port-forward deploy/<release>-backend 8080:8080
dbImage:
  enabled: false
  repository: coleifer/sqlite-web
  tag: latest
  pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Restrict who may connect to the pods (templates/networkpolicy.yaml), ingress only:
#   backend  :3000 <- the frontend's nginx (`location /api`), nothing else
#   frontend :80   <- Traefik in kube-system (Ingress dietetyk.renacode.com)
# Checked on the cluster on 2026-10-03 (`ss` inside the pods' network namespaces): Traefik
# was the only peer of the frontend and nothing but the frontend talked to the backend.
# Monitoring, the notification gateway (bramka) and Argo CD do not connect to these pods.
# Kubelet probes and `kubectl port-forward` are not affected (see the template header).
# Quick rollback: set `enabled: false` and let Argo CD sync - the policies are deleted.
networkPolicy:
  enabled: true
  traefik:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  # Egress: the pods must not reach the private networks the node routes elsewhere (for
  # example over a VPN tunnel). Everything else outbound is unchanged: DNS, cluster pods, the
  # internet, the API server. Rules: `dietetyk.regulyEgress` in _helpers.tpl.
  #
  # `siecDomowa` lists the CIDRs to block. It is EMPTY here on purpose - this repository is
  # public, and the cluster operator sets the real list in the Argo CD Application's
  # `valuesObject` (private infra repo). An empty list means the egress policy lets the
  # whole internet through and blocks nothing extra.
  # Quick rollback of egress alone: `egress.enabled: false`.
  egress:
    enabled: true
    siecDomowa: []

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: dietetyk.renacode.com
  tlsSecret: dietetyk-tls-cert
  # Second Ingress on port 80 that only redirects to HTTPS (templates/middleware.yaml).
  redirectToHttps: true

# SSO (Authelia with enforced 2FA, renacode-infra k3s/platforma/authelia.yaml) in front of the
# WHOLE host, except two machine paths (templates/ingress-machine.yaml): the Apple Health webhook
# and token-shared PDF reports. Off by default; the cluster operator turns it on in the Argo CD
# valuesObject after registering 2FA. With it on, every user needs an Authelia account (group
# `dietetyk`) - public registration is closed in practice. The app's own login stays.
sso:
  enabled: false
  # Middlewares on the main Ingress, IN THIS ORDER: strip client-supplied Remote-* identity
  # headers, then forwardAuth (which sets them from Authelia). Identity contract:
  # renacode-infra docs/sso-tozsamosc.md.
  middlewares:
    - default-authelia-naglowki@kubernetescrd
    - default-authelia-sso@kubernetescrd
  # The same header-strip middleware for the machine routes (IngressRoute syntax).
  stripHeadersMiddleware:
    name: authelia-naglowki
    namespace: default
  # The same switch also sets SSO_NAGLOWKI=1 in the backend pod (templates/backend-deployment.yaml):
  # the app trusts Remote-* headers ONLY then, so stripping and trust are always on or off
  # together. "Wyloguj" sends the browser to <portalUrl>/logout?rd=https://<ingress.host>/.
  portalUrl: https://auth.renacode.com
  # Authelia groups admitted by the app (SSO_GRUPY). Entry only - the admin role comes from the
  # app's database. Must agree with the host's rule in renacode-infra authelia.yaml.
  allowedGroups:
    - wlasciciel
    - rodzina
    - admins
    - dietetyk
  # Authelia groups that see the Argo CD entry in the app switcher (SSO_GRUPY_ARGO) - the owner's
  # two users. Display only (Argo CD has its own Authelia rule); an account with the admin role
  # in the app's database sees it as well. Never put `rodzina` here.
  argoGroups:
    - wlasciciel
    - admins

persistence:
  size: 2Gi
  storageClass: local-path
