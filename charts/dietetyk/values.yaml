replicaCount: 1

# Credentials for pulling the backend/frontend images.
#
# The ghcr.io/renacode/* packages are private, and a private GHCR package issues
# no anonymous pull token - without this secret the kubelet gets HTTP 401 and the
# pods stay in ImagePullBackOff.
#
# Create the secret once per namespace, using a GitHub Personal Access Token that
# has the read:packages scope:
#
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<PAT with read:packages> \
#     --namespace=<release namespace>
#
# Alternative, if you would rather not manage a secret at all: make both packages
# public at https://github.com/users/renacode/packages, then leave this list empty.
# That publishes the built images to anyone, so it is a deliberate trade-off, not
# a shortcut - the images contain the application code but no secrets (those come
# from the environment and the database at runtime).
imagePullSecrets:
  - name: ghcr-pull

backend:
  image:
    repository: ghcr.io/renacode/dietetyk-ai-backend
    tag: "sha-6538e08"
    pullPolicy: Always
  secretName: dietetyk-backend-secret
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

frontend:
  image:
    repository: ghcr.io/renacode/dietetyk-ai-frontend
    tag: "sha-6538e08"
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

dbImage:
  repository: coleifer/sqlite-web
  tag: latest
  pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: dietetyk.renacode.com
  tlsSecret: dietetyk-tls-cert

persistence:
  size: 2Gi
  storageClass: local-path
